name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH to Debian server and deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/admin_mybsu/famcs-coin
            
            # Pull latest changes from git
            git pull origin main
            
            # Export environment variables for docker-compose (if passed from GH Actions, though usually handled via a .env file on server)
            export TG_BOT_TOKEN=${{ secrets.TG_BOT_TOKEN }}
            export DB_USER=${{ secrets.DB_USER }}
            export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            
            # Build and restart containers in detached mode
            docker-compose -f docker-compose.prod.yml up -d --build
