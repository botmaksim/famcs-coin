version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: famcscoin_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - famcs_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: famcscoin_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - ./backend:/app
    working_dir: /app
    command: sh -c "go mod tidy && go run main.go"
    depends_on:
      - db
    networks:
      - famcs_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: famcscoin_frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port ${FRONTEND_PORT}"
    networks:
      - famcs_network

volumes:
  pgdata:

networks:
  famcs_network:
    driver: bridge