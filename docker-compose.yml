version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: famcscoin_db
    restart: unless-stopped
    env_file:
      - .env
    network_mode: "host"
    environment:
      - PGPORT=${POSTGRES_PORT}
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: famcscoin_backend
    restart: unless-stopped
    env_file:
      - .env
    network_mode: "host"
    volumes:
      - ./backend:/app
    working_dir: /app
    command: sh -c "go mod tidy && go run main.go"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: famcscoin_frontend
    restart: unless-stopped
    env_file:
      - .env
    network_mode: "host"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port ${FRONTEND_PORT}"

volumes:
  pgdata:
